<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에겐녀 vs 테토녀 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 가독성을 위해 본문 폰트는 Pretendard, 포인트는 Gaegu 사용 */
        body { font-family: 'Pretendard', sans-serif; background-color: #fdfbf7; touch-action: manipulation; letter-spacing: -0.02em; }
        .font-point { font-family: 'Gaegu', cursive; }
        
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .character-bounce { animation: bounce 2.5s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        
        /* 세련된 버튼 클릭 효과 */
        .btn-press:active { transform: scale(0.97); transition: 0.1s; }
        
        /* 부드러운 카드 쉐도우 */
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body class="flex items-center justify-center min-h-screen p-6 text-gray-900">

    <!-- 메인 컨테이너 -->
    <div id="app" class="max-w-[420px] w-full bg-white rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.08)] overflow-hidden p-10 text-center border border-gray-100 relative">
        
        <!-- 시작 화면 -->
        <div id="start-screen" class="fade-in">
            <div class="text-7xl mb-8 character-bounce drop-shadow-sm">🐰 vs 🥔</div>
            <h1 class="text-4xl font-black text-gray-900 mb-4 font-point tracking-tight">에겐녀 vs 테토녀</h1>
            <p class="text-gray-500 mb-12 text-lg leading-relaxed font-medium">
                당신의 일상 속 정체성,<br><span class="text-yellow-500 font-bold">에너자이저</span>인가요, <span class="text-gray-700 font-bold">전략가</span>인가요?
            </p>
            <button onclick="startTest()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-extrabold py-5 rounded-[1.25rem] text-xl transition-all shadow-lg shadow-yellow-100 btn-press">
                테스트 시작하기
            </button>
        </div>

        <!-- 질문 화면 -->
        <div id="question-screen" class="hidden fade-in">
            <div class="flex flex-col items-center mb-10">
                <div id="char-icon" class="text-5xl mb-4 transition-all duration-500">🐰</div>
                <div class="w-full bg-gray-50 h-2.5 rounded-full overflow-hidden border border-gray-100">
                    <div id="progress-bar" class="bg-yellow-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 10%"></div>
                </div>
                <span id="progress-text" class="text-gray-400 font-bold mt-3 text-sm tracking-widest uppercase">Step 01 / 10</span>
            </div>
            
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-12 min-h-[120px] flex items-center justify-center break-keep leading-snug tracking-tight">
                질문 내용
            </h2>
            
            <div class="space-y-4">
                <button onclick="handleChoice('A')" id="ans-a" class="w-full bg-gray-50 hover:bg-yellow-50 border-2 border-transparent hover:border-yellow-200 py-5 px-6 rounded-2xl text-lg transition-all text-gray-700 font-semibold btn-press text-left flex items-center shadow-sm">
                    선택지 A
                </button>
                <button onclick="handleChoice('B')" id="ans-b" class="w-full bg-gray-50 hover:bg-yellow-50 border-2 border-transparent hover:border-yellow-200 py-5 px-6 rounded-2xl text-lg transition-all text-gray-700 font-semibold btn-press text-left flex items-center shadow-sm">
                    선택지 B
                </button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden fade-in px-2">
            <div id="result-char" class="text-7xl mb-6 character-bounce">🎉</div>
            <p class="text-sm font-bold text-yellow-500 uppercase tracking-widest mb-2">My Result is</p>
            <div id="result-title" class="text-4xl font-black text-gray-900 mb-8 tracking-tighter font-point">결과 타이틀</div>
            
            <div class="bg-gray-50 rounded-[2rem] p-8 mb-8 border border-gray-100">
                <div class="flex justify-between items-center mb-8 px-2">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter mb-1">Egen Type</span>
                        <div id="egen-percent" class="text-2xl font-black text-pink-500">0%</div>
                    </div>
                    <div class="h-8 w-[1px] bg-gray-200"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter mb-1">Teto Type</span>
                        <div id="teto-percent" class="text-2xl font-black text-blue-500">0%</div>
                    </div>
                </div>
                <p id="result-desc" class="text-gray-600 leading-relaxed text-[17px] break-keep font-medium italic">
                    결과 설명
                </p>
            </div>
            
            <div class="flex flex-col gap-3">
                <button onclick="shareResult()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-5 rounded-[1.25rem] text-lg transition-all flex items-center justify-center gap-2 btn-press shadow-xl">
                    <span>공유하기</span>
                </button>
                <button onclick="location.reload()" class="w-full bg-white border-2 border-gray-100 text-gray-400 font-bold py-4 rounded-[1.25rem] text-sm hover:bg-gray-50 transition-all btn-press">
                    테스트 다시 하기
                </button>
            </div>
            
            <p id="copy-msg" class="text-gray-400 mt-6 text-sm font-bold opacity-0 transition-opacity duration-300">링크가 복사되었습니다!</p>
        </div>
    </div>

    <script>
        const questions = [
            { q: "친구가 우울해서 화분을 샀다고 한다면?", a: "기분은 좀 어때? 무슨 화분이야?", b: "오, 어떤 종류? 키우기 쉬운 거야?", icons: ["🐰", "🥔"] },
            { q: "내일 갑자기 약속이 취소되었다면?", a: "오히려 좋아! 혼자 카페 투어 가야지!", b: "이미 짠 동선이 아까우니 다른 할 일을 찾는다.", icons: ["🏃", "📅"] },
            { q: "배달 음식이 1시간 늦게 도착했다면?", a: "바쁘신가 보다... 맛있게 먹자!", b: "정확한 늦은 사유를 확인하고 고객센터 문의.", icons: ["🍕", "📞"] },
            { q: "처음 보는 사람들과의 모임에서 나는?", a: "분위기 메이커! 질문을 먼저 던진다.", b: "우선 관찰하며 필요한 대화 위주로 참여한다.", icons: ["📢", "👀"] },
            { q: "친구가 '나 오늘 너무 힘들어'라고 하면?", a: "누가 괴롭혔어? 맛있는 거 먹으러 가자!", b: "무슨 일 때문에 힘든 거야? 해결책이 있을까?", icons: ["🍫", "🔍"] },
            { q: "내가 생각하는 성공적인 하루란?", a: "사람들과 즐겁게 웃고 행복했던 하루", b: "계획했던 리스트를 모두 완수한 하루", icons: ["🌈", "✅"] },
            { q: "좋아하는 연예인이 결혼한다고 하면?", a: "대박! 둘이 너무 잘 어울려 축하해!", b: "언제부터 만난 거지? 관련 기사를 검색해본다.", icons: ["💍", "📰"] },
            { q: "길을 가다 예쁜 노을을 발견하면?", a: "사진 찍어서 친구들한테 단톡 발송!", b: "오늘 미세먼지 수치가 낮아서 그런가 생각한다.", icons: ["📸", "🌫️"] },
            { q: "주말에 집에서 쉴 때 나는?", a: "에너지 충전을 위해 계속 누워만 있는다.", b: "밀린 청소를 하거나 자기계발을 한다.", icons: ["🛌", "🧹"] },
            { q: "이 테스트 결과가 어떻게 나올 것 같아?", a: "재밌는 결과면 좋겠다! 두근두근!", b: "질문 성향상 어떤 쪽일지 이미 감이 온다.", icons: ["💖", "🤔"] }
        ];

        let currentIdx = 0;
        let egenScore = 0;

        function startTest() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('ans-a').innerText = q.a;
            document.getElementById('ans-b').innerText = q.b;
            document.getElementById('progress-text').innerText = `Step ${String(currentIdx + 1).padStart(2, '0')} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            document.getElementById('char-icon').innerText = q.icons[0];
        }

        function handleChoice(choice) {
            if (choice === 'A') egenScore++;
            currentIdx++;

            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const egenPct = Math.round((egenScore / questions.length) * 100);
            const tetoPct = 100 - egenPct;

            document.getElementById('egen-percent').innerText = `${egenPct}%`;
            document.getElementById('teto-percent').innerText = `${tetoPct}%`;

            let title = "";
            let desc = "";
            let icon = "";

            if (egenPct >= 70) {
                title = "에너지 뿜뿜 에겐녀";
                icon = "🐰";
                desc = "당신은 세상의 햇살 같은 사람! 긍정적인 에너지로 주변 사람들까지 행복하게 만들어요. 감정 공감 능력이 뛰어나 친구들에게 인기가 아주 많군요!";
            } else if (tetoPct >= 70) {
                title = "냉철한 지성 테토녀";
                icon = "🥔";
                desc = "당신은 아주 스마트하고 효율적인 사람! 감정에 휘둘리기보다 정확한 분석과 계획을 선호해요. 당신의 논리적인 조언은 언제나 핵심을 찌릅니다!";
            } else {
                title = "반전 매력 하이브리드";
                icon = "✨";
                desc = "공감과 논리를 완벽하게 섞어놓은 균형 잡힌 사람! 상황에 따라 에겐녀의 따뜻함과 테토녀의 이성을 자유자재로 꺼내 쓰는 매력덩어리네요!";
            }

            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = `"${desc}"`;
            document.getElementById('result-char').innerText = icon;
        }

        async function shareResult() {
            const title = "에겐녀 vs 테토녀 테스트 결과";
            const text = `나의 정체성은? [${document.getElementById('result-title').innerText}] 가 나왔어요!`;
            const url = window.location.href;

            if (navigator.share) {
                try {
                    await navigator.share({ title: title, text: text, url: url });
                } catch (err) {
                    copyToClipboard(url);
                }
            } else {
                copyToClipboard(url);
            }
        }

        function copyToClipboard(text) {
            const dummy = document.createElement("input");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            
            const msg = document.getElementById('copy-msg');
            msg.style.opacity = '1';
            setTimeout(() => { msg.style.opacity = '0'; }, 2000);
        }
    </script>
</body>
</html>
