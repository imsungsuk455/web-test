<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에겐녀 vs 테토녀 성향 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display {
            font-family: 'Jua', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scale-button:active {
            transform: scale(0.97);
        }
        /* Custom Progress Bar Transition */
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-blue-50 min-h-screen flex items-center justify-center text-slate-800 antialiased overflow-x-hidden selection:bg-pink-100 selection:text-pink-600">
    
    <div id="app" class="w-full max-w-[480px] min-h-[600px] p-6 relative">
        <!-- Content will be injected here via JavaScript -->
    </div>

    <script>
        // --- DATA ---
        const QUESTIONS = [
            {
                id: 1,
                text: "친구가 우울해서 화분을 샀다고 한다.\n나의 반응은?",
                A: "무슨 화분 샀어? 초록초록한 거 보니까 좀 나아져? 🥺", // Egen
                B: "오, 화분? 식물 키우는 게 우울증 완화에 효과가 있대! 🧐" // Teto
            },
            {
                id: 2,
                text: "약속 시간 1시간 전, 갑자기 친구가 약속을 취소했다.",
                A: "아쉽다... 보고 싶었는데 ㅠㅠ 무슨 일 있어?",
                B: "오케이! (바로 넷플릭스 켜거나 밀린 할 일을 정리한다)"
            },
            {
                id: 3,
                text: "배달 음식이 예정 시간보다 30분이나 늦어지고 있다.",
                A: "배달 기사님이 오는 길에 무슨 일 생기셨나? 걱정되네...",
                B: "가게에 전화해서 위치 확인하고 예상 도착 시간 다시 묻는다."
            },
            {
                id: 4,
                text: "여러 명이 모인 모임 자리,\n나의 역할은?",
                A: "분위기 메이커! 어색한 침묵은 참을 수 없어, 리액션 담당!",
                B: "정보 제공자! 맛집 위치, 회비 계산, 최적의 루트 검색 담당!"
            },
            {
                id: 5,
                text: "친구가 연애 고민을 털어놓으며 운다.",
                A: "같이 울어주거나 등을 토닥이며 '진짜 속상했겠다...' 공감한다.",
                B: "휴지를 건네주며 '그래서 그 사람이 정확히 뭐라고 했는데?' 분석한다."
            },
            {
                id: 6,
                text: "나에게 있어 '성공적인 하루'란?",
                A: "많이 웃고, 주변 사람들과 즐거운 대화를 나눈 하루 ✨",
                B: "계획했던 To-Do List를 모두 완벽하게 클리어한 하루 ✅"
            },
            {
                id: 7,
                text: "좋아하는 연예인의 결혼 소식을 들었을 때!",
                A: "헐 대박... ㅠㅠ 행복하게 사세요... (괜히 내가 뭉클)",
                B: "상대가 누구지? (바로 나무위키나 기사를 검색해본다)"
            },
            {
                id: 8,
                text: "길을 걷다가 엄청나게 예쁜 핑크빛 노을을 발견했다.",
                A: "와 미쳤다... 너무 예뻐... (바로 사진 찍어서 인스타 업로드)",
                B: "내일 비 오려나? 붉은 노을은 대기 중 수증기 때문이라던데."
            },
            {
                id: 9,
                text: "꿀 같은 주말, 나의 휴식 스타일은?",
                A: "핫플 카페 가서 사람 구경하고 에너지 충전!",
                B: "집에서 에어컨 틀고 좋아하는 유튜브 보며 조용히 충전."
            },
            {
                id: 10,
                text: "이 테스트 결과, 어떻게 나올 것 같아?",
                A: "완전 귀여운 캐릭터 나왔으면 좋겠다! 재밌겠다 헤헤",
                B: "내 성향 분석 데이터가 정확하게 나올지 궁금하네."
            }
        ];

        const RESULTS = {
            EGEN: {
                title: "해피바이러스 에겐녀",
                subtitle: "Energy & Positive",
                desc: "당신은 긍정 에너지 뿜뿜! 주변을 환하게 밝히는 인간 비타민입니다.<br>감수성이 풍부하고 공감 능력이 뛰어나 친구들에게 인기가 많아요.<br>논리보다는 마음이 시키는 대로 움직일 때 더 행복함을 느끼는 당신!",
                emoji: "🐰",
                color: "pink",
                tags: ["#파워긍정", "#리액션부자", "#감성충만", "#핵인싸"]
            },
            TETO: {
                title: "스마트한 테토녀",
                subtitle: "Tech & Logical",
                desc: "당신은 논리와 이성의 결정체! 차가운 도시 여자 같지만 내 사람에겐 따뜻하죠.<br>효율성을 중시하고 문제 해결 능력이 탁월합니다.<br>감정에 휩쓸리기보다 팩트를 기반으로 현명한 판단을 내리는 뇌섹녀!",
                emoji: "🦊",
                color: "cyan",
                tags: ["#논리왕", "#효율중시", "#팩트폭격", "#스마트"]
            },
            HYBRID: {
                title: "완벽한 밸런스 하이브리드",
                subtitle: "Hybrid Master",
                desc: "따뜻한 가슴과 차가운 머리를 동시에 가진 당신!<br>상황에 따라 유연하게 대처하는 능력이 뛰어납니다.<br>공감할 땐 공감하고, 분석할 땐 분석하는 당신은 이 구역의 진정한 능력자!",
                emoji: "🦄",
                color: "purple",
                tags: ["#반전매력", "#유연함", "#황금밸런스", "#멀티플레이어"]
            }
        };

        // --- STATE MANAGEMENT ---
        let currentState = {
            step: 0, // 0: Welcome, 1~10: Questions, 11: Result
            scores: { A: 0, B: 0 } // A: Egen, B: Teto
        };

        const app = document.getElementById('app');

        // --- RENDER FUNCTIONS ---

        function renderWelcome() {
            app.innerHTML = `
                <div class="fade-in flex flex-col items-center justify-center h-full text-center">
                    <div class="bg-white/60 backdrop-blur-md p-8 rounded-[2rem] shadow-xl border border-white w-full">
                        <div class="text-7xl mb-6 animate-bounce cursor-default">✨</div>
                        <h1 class="font-display text-4xl mb-2 text-slate-800 break-keep">
                            <span class="text-pink-500">에겐녀</span> VS <span class="text-cyan-600">테토녀</span>
                        </h1>
                        <p class="text-lg font-bold text-slate-500 mb-8 tracking-wide">성향 판별 테스트</p>
                        
                        <div class="space-y-3 mb-8 text-left bg-slate-50 p-6 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🐰</span>
                                <div>
                                    <span class="font-bold text-pink-500 text-sm">Egen (Energy)</span>
                                    <p class="text-xs text-slate-500">긍정, 감성, 리액션</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🦊</span>
                                <div>
                                    <span class="font-bold text-cyan-600 text-sm">Teto (Tech/Logic)</span>
                                    <p class="text-xs text-slate-500">논리, 이성, 효율</p>
                                </div>
                            </div>
                        </div>

                        <button onclick="startTest()" class="w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-2xl shadow-lg hover:bg-slate-700 transition-all scale-button">
                            테스트 시작하기
                        </button>
                    </div>
                    <p class="mt-6 text-xs text-slate-400">© 2024 Egen vs Teto Test</p>
                </div>
            `;
        }

        function renderQuestion() {
            const index = currentState.step - 1;
            const question = QUESTIONS[index];
            const progress = (currentState.step / QUESTIONS.length) * 100;
            const character = index % 2 === 0 ? '🤔' : '👀';

            app.innerHTML = `
                <div class="fade-in flex flex-col h-full max-w-md mx-auto">
                    <!-- Header -->
                    <div class="mb-8 text-center">
                        <span class="text-4xl inline-block mb-4 transition-transform hover:scale-110">${character}</span>
                        <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden relative">
                            <div class="progress-bar h-full bg-gradient-to-r from-pink-400 to-cyan-400 rounded-full" style="width: ${progress}%"></div>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-slate-400 mt-2 px-1">
                            <span>Q${currentState.step}</span>
                            <span>${QUESTIONS.length}</span>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white p-8 rounded-3xl shadow-lg mb-6 relative overflow-hidden border border-slate-100">
                        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-pink-300 to-cyan-300"></div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 leading-relaxed font-display text-center break-keep">
                            ${question.text.replace(/\n/g, '<br/>')}
                        </h2>
                    </div>

                    <!-- Answers -->
                    <div class="space-y-4 flex-1">
                        <button onclick="handleAnswer('A')" class="w-full p-5 text-left bg-white rounded-2xl shadow-sm border-2 border-transparent hover:border-pink-300 hover:bg-pink-50 transition-all duration-200 group scale-button">
                            <div class="flex items-start gap-3">
                                <span class="bg-pink-100 text-pink-600 text-sm font-bold px-2.5 py-1 rounded-lg shrink-0 group-hover:bg-pink-200">A</span>
                                <span class="text-slate-700 font-medium leading-relaxed text-sm sm:text-base">${question.A}</span>
                            </div>
                        </button>

                        <button onclick="handleAnswer('B')" class="w-full p-5 text-left bg-white rounded-2xl shadow-sm border-2 border-transparent hover:border-cyan-300 hover:bg-cyan-50 transition-all duration-200 group scale-button">
                            <div class="flex items-start gap-3">
                                <span class="bg-cyan-100 text-cyan-600 text-sm font-bold px-2.5 py-1 rounded-lg shrink-0 group-hover:bg-cyan-200">B</span>
                                <span class="text-slate-700 font-medium leading-relaxed text-sm sm:text-base">${question.B}</span>
                            </div>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const total = QUESTIONS.length;
            const egenPercent = Math.round((currentState.scores.A / total) * 100);
            const tetoPercent = Math.round((currentState.scores.B / total) * 100);

            let type = 'HYBRID';
            if (egenPercent >= 70) type = 'EGEN';
            else if (tetoPercent >= 70) type = 'TETO';

            const data = RESULTS[type];

            // Colors based on result
            let bgClass = type === 'EGEN' ? 'bg-pink-50' : (type === 'TETO' ? 'bg-cyan-50' : 'bg-purple-50');
            let textClass = type === 'EGEN' ? 'text-pink-500' : (type === 'TETO' ? 'text-cyan-600' : 'text-purple-500');
            let barBg = type === 'EGEN' ? 'bg-pink-400' : (type === 'TETO' ? 'bg-cyan-500' : 'bg-purple-400');

            app.innerHTML = `
                <div class="fade-in w-full pb-8">
                    <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-4 border-white">
                        <!-- Result Header -->
                        <div class="p-10 text-center ${bgClass} relative">
                            <div class="text-8xl mb-4 transform hover:scale-110 transition-transform duration-300 cursor-default inline-block">
                                ${data.emoji}
                            </div>
                            <p class="text-sm font-bold tracking-wider text-slate-500 mb-1 uppercase">${data.subtitle}</p>
                            <h2 class="font-display text-3xl sm:text-4xl font-bold ${textClass} mb-4 break-keep">
                                ${data.title}
                            </h2>
                            <div class="flex flex-wrap justify-center gap-2">
                                ${data.tags.map(tag => `<span class="bg-white/80 px-3 py-1 rounded-full text-xs font-bold text-slate-600 shadow-sm">${tag}</span>`).join('')}
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="p-8">
                            <p class="text-slate-600 leading-7 text-center mb-8 text-sm sm:text-base break-keep">
                                ${data.desc}
                            </p>

                            <!-- Graphs -->
                            <div class="space-y-5 mb-10 bg-slate-50 p-5 rounded-2xl">
                                <div>
                                    <div class="flex justify-between text-xs font-bold mb-1.5">
                                        <span class="text-pink-500 flex items-center gap-1">🐰 에겐력</span>
                                        <span class="text-pink-500">${egenPercent}%</span>
                                    </div>
                                    <div class="h-3 bg-white rounded-full overflow-hidden shadow-inner">
                                        <div class="h-full bg-pink-400 rounded-full transition-all duration-1000" style="width: ${egenPercent}%"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-bold mb-1.5">
                                        <span class="text-cyan-600 flex items-center gap-1">🦊 테토력</span>
                                        <span class="text-cyan-600">${tetoPercent}%</span>
                                    </div>
                                    <div class="h-3 bg-white rounded-full overflow-hidden shadow-inner">
                                        <div class="h-full bg-cyan-500 rounded-full transition-all duration-1000" style="width: ${tetoPercent}%"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="grid gap-3">
                                <button onclick="shareResult('${data.title}')" class="flex items-center justify-center gap-2 w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-slate-700 transition-all scale-button">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                                    결과 공유하기
                                </button>
                                <button onclick="resetTest()" class="flex items-center justify-center gap-2 w-full bg-white text-slate-700 font-bold py-4 rounded-2xl border-2 border-slate-100 hover:bg-slate-50 transition-all scale-button">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                    다시 하기
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- LOGIC FUNCTIONS ---

        function startTest() {
            currentState.step = 1;
            renderQuestion();
        }

        function handleAnswer(choice) {
            currentState.scores[choice]++;
            currentState.step++;

            if (currentState.step > QUESTIONS.length) {
                renderResult();
            } else {
                renderQuestion();
            }
        }

        function resetTest() {
            currentState = { step: 0, scores: { A: 0, B: 0 } };
            renderWelcome();
        }

        async function shareResult(resultTitle) {
            const url = window.location.href;
            const text = `[에겐녀 vs 테토녀 테스트]\n나의 결과는: ${resultTitle}!\n\n테스트 하러가기 👇`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: '에겐녀 vs 테토녀 테스트',
                        text: text,
                        url: url
                    });
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                // Fallback for desktop/unsupported browsers
                try {
                    await navigator.clipboard.writeText(`${text}\n${url}`);
                    alert('결과 링크가 복사되었습니다! 친구들에게 공유해보세요 💌');
                } catch (err) {
                    alert('링크 복사에 실패했습니다 🥲');
                }
            }
        }

        // --- INIT ---
        window.onload = () => {
            renderWelcome();
        };

    </script>
</body>
</html>
